name: pulseboard
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ROOM_TTL: ${ROOM_TTL:-168h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      MAX_ROOM_USERS: ${MAX_ROOM_USERS:-250}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-2000}
      MAX_STROKES_PER_ROOM: ${MAX_STROKES_PER_ROOM:-5000}
      SNAPSHOT_CACHE_TTL: ${SNAPSHOT_CACHE_TTL:-15s}
      SNAPSHOT_CACHE_MAX_BYTES: ${SNAPSHOT_CACHE_MAX_BYTES:-67108864}
      MAX_CONCURRENT_RESTORES: ${MAX_CONCURRENT_RESTORES:-32}
      ENABLE_WEBSOCKET_COMPRESSION: ${ENABLE_WEBSOCKET_COMPRESSION:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://app:8080
      WS_URL: ws://app:8080
      VUS: ${VUS:-100}
      TEST_DURATION: ${TEST_DURATION:-30s}
      OPS_PER_SECOND: ${OPS_PER_SECOND:-10}
      ROOMS: ${ROOMS:-1}
      MODEL: ${MODEL:-realistic}
      ACTIVE_USER_FRACTION: ${ACTIVE_USER_FRACTION:-0.25}
      ACTIVE_STROKES_PER_SECOND: ${ACTIVE_STROKES_PER_SECOND:-0.35}
      CURSOR_UPDATES_PER_SECOND: ${CURSOR_UPDATES_PER_SECOND:-0.5}
    volumes:
      - ./load:/scripts:ro
    command: ["run", "/scripts/collaboration.js"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  redis-data:
  prometheus-data:
